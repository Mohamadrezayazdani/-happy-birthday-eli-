<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تولدت مبارک 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fff1f5;--bg2:#ffe0ec;--card:#ffffffcc;--text:#3b1030;--muted:#8a5a78;--accent:#e0306f;--accent2:#ff8a3d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1a0b17;--bg2:#2d1030;--card:#ffffff14;--text:#ffeaf3;--muted:#d6a5c0;--accent:#ff5c9a;--accent2:#ffa45c;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#1a0b17;--bg2:#2d1030;--card:#ffffff14;--text:#ffeaf3;--muted:#d6a5c0;--accent:#ff5c9a;--accent2:#ffa45c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Vazirmatn,Tahoma,sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--text);display:flex;align-items:center;justify-content:center;padding:20px;overflow-x:hidden;text-align:right}
main{width:100%;max-width:620px;position:relative;z-index:2}
h1{font-size:clamp(28px,8vw,46px);font-weight:900;margin:0 0 6px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin:0 0 24px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.box{text-align:center;background:var(--card);backdrop-filter:blur(8px);border-radius:18px;padding:16px 4px;box-shadow:0 6px 24px #e0306f22}
.num{font-size:clamp(26px,9vw,44px);font-weight:900;font-variant-numeric:tabular-nums;color:var(--accent)}
.lbl{font-size:14px;color:var(--muted);margin-top:2px}
.info{margin-top:22px;color:var(--muted);font-size:14px;line-height:2}
.info b{color:var(--text);direction:ltr;unicode-bidi:embed}
#party{display:none}
#party h2{font-size:clamp(30px,9vw,52px);margin:0 0 10px}
.cake{font-size:90px;display:inline-block;animation:b 1s infinite alternate}
@keyframes b{to{transform:translateY(-14px) rotate(6deg)}}
.f{position:fixed;top:-40px;font-size:24px;animation:fall linear forwards;z-index:1;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
</style>
</head>
<body>
<main>
  <div id="count">
    <h1>🎂 تولدت مبارک 🎉</h1>
    <p class="sub">تا لحظه‌ی جشن تولد چیزی نمانده…</p>
    <div class="grid">
      <div class="box"><div class="num" id="d">۰</div><div class="lbl">روز</div></div>
      <div class="box"><div class="num" id="h">۰</div><div class="lbl">ساعت</div></div>
      <div class="box"><div class="num" id="m">۰</div><div class="lbl">دقیقه</div></div>
      <div class="box"><div class="num" id="s">۰</div><div class="lbl">ثانیه</div></div>
    </div>
    <div class="info">
      هدف: <b>۱۱ دی ۱۴۰۵ — ساعت ۰۰:۰۰ به وقت تهران</b><br>
      اکنون در تهران: <b id="now">—</b>
    </div>
  </div>
  <div id="party">
    <div class="cake">🎂</div>
    <h2>تولدت مبارک! 🥳</h2>
    <p class="sub">امیدوارم سالی پر از شادی، سلامتی و موفقیت داشته باشی 💖</p>
  </div>
</main>
<script>
// ۱۱ دی ۱۴۰۵ = 1 ژانویه 2027، نیمه‌شب به وقت تهران (UTC+03:30)
const TARGET = new Date("2027-01-01T00:00:00+03:30").getTime();
const fa = n => String(n).replace(/\d/g, x => "۰۱۲۳۴۵۶۷۸۹"[x]);
const pad = n => fa(String(n).padStart(2, "0"));
const $ = id => document.getElementById(id);
const tehran = new Intl.DateTimeFormat("fa-IR", {timeZone:"Asia/Tehran", year:"numeric", month:"long", day:"numeric", hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false});
let celebrated = false;

function tick(){
  const now = Date.now();
  let diff = TARGET - now;
  try { $("now").textContent = tehran.format(now); } catch(e){}
  if (diff <= 0) { celebrate(); return; }
  const t = Math.floor(diff / 1000);
  $("d").textContent = fa(Math.floor(t / 86400));
  $("h").textContent = pad(Math.floor(t % 86400 / 3600));
  $("m").textContent = pad(Math.floor(t % 3600 / 60));
  $("s").textContent = pad(t % 60);
  setTimeout(tick, 1000 - (now % 1000) + 5); // هم‌زمان با مرز دقیق هر ثانیه
}

function celebrate(){
  if (celebrated) return;
  celebrated = true;
  $("count").style.display = "none";
  $("party").style.display = "block";
  const em = ["🎉","🎊","🎈","💖","✨","🎂","🥳"];
  setInterval(() => {
    const e = document.createElement("div");
    e.className = "f";
    e.textContent = em[Math.floor(Math.random() * em.length)];
    e.style.left = Math.random() * 100 + "vw";
    e.style.animationDuration = 3 + Math.random() * 3 + "s";
    document.body.appendChild(e);
    setTimeout(() => e.remove(), 6500);
  }, 220);
}
tick();
</script>
</body>
</html>
